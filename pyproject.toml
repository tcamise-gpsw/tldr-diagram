[project]
name = "tldr-diagram"
version = "0.2.0"
description = "TL;DR — Tool for Linking Dependency Relationships. Architecture diagram generator with tree-sitter source analysis."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-kotlin>=1.1.0",
]

[project.scripts]
tldr = "tldr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.force-include]
"src/tldr/_frontend" = "src/tldr/_frontend"

[tool.hatch.build.targets.wheel]
packages = ["src/tldr"]

[tool.hatch.build.targets.wheel.force-include]
"src/tldr/_frontend" = "tldr/_frontend"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
